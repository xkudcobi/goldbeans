name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy; yenisi geleni beklemesin diye eskisi iptal edilmiyor
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx oxlint

      # Sitenin hangi yolda duracağını belirler; vite.config.js bunu
      # BASE_PATH'ten okuyor, çizimlerdeki __BASE__ de buradan doluyor.
      #
      #   ÖZEL ALAN ADI VARSA (public/CNAME dosyası)  → site kökte  → '/'
      #   YOKSA (kullanici.github.io/<repo> adresi)   → alt yolda   → '/<repo>/'
      #
      # Bu ayrım otomatik: alan adına geçerken tek yapman gereken içinde
      # sadece alan adı yazan bir public/CNAME dosyası eklemek. Elle
      # değiştirilseydi, unutulduğunda site tüm CSS/JS'ini yanlış yoldan
      # arayıp bomboş açılırdı.
      - name: Taban yolunu belirle
        id: base
        run: |
          if [ -f public/CNAME ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
            echo "Özel alan adı bulundu ($(cat public/CNAME)) — taban: /"
          else
            echo "path=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
            echo "Özel alan adı yok — taban: /${{ github.event.repository.name }}/"
          fi

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
